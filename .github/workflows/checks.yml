name: List checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      broken: ${{ steps.links.outputs.exit_code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - run: npx --yes awesome-lint@2.3.0
      - name: Check links
        id: links
        if: always()
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress readme.md
          format: json
          output: lychee/out.json
          fail: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: link-report
          path: lychee/out.json
          retention-days: 14
      - name: Fail on broken links
        if: steps.links.outputs.exit_code != '0'
        run: exit 1
  report-broken-links:
    needs: checks
    if: >-
      always() && needs.checks.outputs.broken != '' && needs.checks.outputs.broken != '0' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    concurrency:
      group: link-failure-report
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: link-report
          path: report
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('report/out.json', 'utf8'));
            const marker = '<!-- link-check-failure -->';
            const body = 'Link check failed. Review before changing entries.\n\n```json\n' + JSON.stringify({errors: data.error_map, timeouts: data.timeout_map}, null, 2) + '\n```\n\n' + marker;
            const issues = await github.paginate(github.rest.issues.listForRepo, {...context.repo, state: 'open', per_page: 100});
            const existing = issues.find(i => !i.pull_request && i.body?.includes(marker));
            if (existing) await github.rest.issues.update({...context.repo, issue_number: existing.number, body});
            else await github.rest.issues.create({...context.repo, title: 'Broken links', body});
